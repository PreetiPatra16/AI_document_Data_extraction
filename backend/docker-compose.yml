services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      STORAGE_DIR: /app/storage
      TEMP_DIR: /app/temp_uploads
      MODEL_DIR: /app/models
      TROCR_MODEL_PATH: /app/models/trocr-handwritten
      LOG_FILE: /app/logs/app.log
    volumes:
      - backend_storage:/app/storage
      - backend_temp:/app/temp_uploads
      - backend_logs:/app/logs
      - ./models:/app/models:ro
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: python -m app.core.workers.extraction_worker
    env_file: .env
    environment:
      STORAGE_DIR: /app/storage
      TEMP_DIR: /app/temp_uploads
      MODEL_DIR: /app/models
      TROCR_MODEL_PATH: /app/models/trocr-handwritten
      LOG_FILE: /app/logs/app.log
    volumes:
      - backend_storage:/app/storage
      - backend_temp:/app/temp_uploads
      - backend_logs:/app/logs
      - ./models:/app/models:ro
      - ./app:/app/app
    restart: unless-stopped

volumes:
  backend_storage:
  backend_temp:
  backend_logs:
